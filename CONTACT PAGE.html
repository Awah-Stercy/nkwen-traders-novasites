<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nkwen Traders - Contact</title>
    <link rel="stylesheet" href="contact.css">
</head>

<body>

    <header>
        <h1>Nkwen Traders</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="catalog.html">Catalog</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Contact Us</h2>

        <!-- Form layout for Jordy's security audit -->
        <form action="#" method="POST">
            <p>
                <label for="fullname">Name:</label><br>
                <input type="text" id="fullname" name="fullname" required>
            </p>

            <p>
                <label for="user_email">Email:</label><br>
                <input type="email" id="user_email" name="user_email" required>
            </p>

            <p>
                <label for="user_message">Message:</label><br>
                <textarea id="user_message" name="user_message" rows="4" required></textarea>
            </p>

            <p>
                <button type="submit">Send Message</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Nkwen Traders. All rights reserved.</p>
    </footer>

</body>
</html>
